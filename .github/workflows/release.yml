name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.2.2.cjs install

      - name: Build native module
        shell: bash
        run: |
          cd crates/native
          cargo build --release --target x86_64-pc-windows-msvc
          mkdir -p ../../build
          cp index.node ../../build/win32-x64.node

      - name: Build bundle
        shell: bash
        run: |
          set -o pipefail
          deno run --allow-all scripts/build.mts --prod 2>&1 | tee bundle.log

      - name: Report bundle failure
        if: failure()
        shell: bash
        run: |
          tail -n 15 bundle.log 2>/dev/null | while IFS= read -r line; do
            echo "::error title=BundleLog::$line"
          done

      - name: Package VSIX
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx --yes @vscode/vsce package --no-dependencies -o "release-${VERSION}.vsix"
          echo "VSIX=release-${VERSION}.vsix" >> "$GITHUB_ENV"

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: release-*.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VSIX }}
          fail_on_unmatched_files: true
          generate_release_notes: true
